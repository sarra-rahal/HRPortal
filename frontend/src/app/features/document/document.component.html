<!-- src/app/document/document.component.html -->
<app-navbar></app-navbar>
<app-sidebar></app-sidebar>

<div class="main-container">
  <div class="content-container container mt-4">
    <h2>My Documents</h2>

    <!-- Toast Notification -->
    <div *ngIf="toastService.toast$ | async as toast" class="toast-notification" [ngClass]="toast.type">
      {{ toast.message }}
    </div>

    <!-- Error Message -->
    <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

    <!-- Loading State -->
    <div *ngIf="isLoading" class="text-center my-4">
      <div class="spinner-border" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <!-- Document List -->
    <div *ngIf="!isLoading && !errorMessage">
      <table class="table table-striped">
        <thead>
        <tr>
          <th>Name</th>
          <th>Uploaded By</th>
          <th>Accessible By</th>
          <th>Upload Date</th>
          <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr *ngFor="let doc of documents">
          <td>{{ doc.name }}</td>
          <td>{{ doc.uploadedBy }}</td>
          <td>{{ formatAccessibleBy(doc.accessibleBy) }}</td>
          <td>{{ doc.uploadDate | date }}</td>
          <td>
            <button class="btn btn-primary btn-sm" (click)="downloadDocument(doc.id, doc.name)" [disabled]="isLoading">
              Download
            </button>
          </td>
        </tr>
        </tbody>
      </table>
      <p *ngIf="!documents.length" class="text-muted">No documents found.</p>
    </div>
  </div>
</div>

<app-footer></app-footer>
