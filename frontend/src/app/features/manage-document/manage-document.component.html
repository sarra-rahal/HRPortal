<app-navbar></app-navbar>
<app-sidebar></app-sidebar>
<div class="main-container">
  <div class="content-container">
    <!-- View Toggle Buttons -->
    <div class="view-toggle">
      <button class="toggle-btn" [class.active]="currentView === 'upload'" (click)="currentView = 'upload'">
        <i class="fas fa-upload"></i> Upload Document
      </button>
      <button class="toggle-btn" [class.active]="currentView === 'generate'" (click)="currentView = 'generate'">
        <i class="fas fa-file-medical"></i> Generate Document
      </button>
      <button class="toggle-btn" [class.active]="currentView === 'list'" (click)="currentView = 'list'">
        <i class="fas fa-list"></i> Document List
      </button>
    </div>

    <!-- Error Message -->
    <div *ngIf="errorMessage" class="error-message">{{ errorMessage }}</div>

    <!-- Loading State -->
    <div *ngIf="isLoading" class="loading">
      <i class="fas fa-spinner fa-spin"></i> Loading...
    </div>

    <!-- Upload Document View -->
    <div *ngIf="currentView === 'upload' && !isLoading && !errorMessage" class="upload-card">
      <h3><i class="fas fa-upload"></i> Upload Document</h3>
      <form class="form-grid">
        <div class="form-group">
          <label for="fileInput"><i class="fas fa-file"></i> Select File</label>
          <input type="file" id="fileInput" class="form-control" (change)="onFileChange($event)">
        </div>
        <div class="form-group">
          <label for="accessibleByType"><i class="fas fa-lock"></i> Access Type</label>
          <select id="accessibleByType" class="form-control" [(ngModel)]="accessibleByType" name="accessibleByType"
                  (ngModelChange)="onAccessibleByTypeChange()">
            <option value="all_departments">All Departments</option>
            <option value="department">Specific Department</option>
            <option value="employees">Specific Employees</option>
          </select>
        </div>
        <div class="form-group" *ngIf="accessibleByType === 'department'">
          <label for="department"><i class="fas fa-building"></i> Department</label>
          <select id="department" class="form-control" [(ngModel)]="departmentValue" name="department"
                  (ngModelChange)="fetchEmployees(departmentValue)">
            <option value="">Select Department</option>
            <option *ngFor="let dept of departments" [value]="dept">{{ dept }}</option>
          </select>
        </div>
        <div class="form-group" *ngIf="accessibleByType === 'employees'">
          <label for="employees"><i class="fas fa-users"></i> Employees (Select Multiple)</label>
          <select id="employees" class="form-control" [(ngModel)]="employeeCins" name="employees" multiple>
            <option *ngFor="let emp of employees" [value]="emp.cin">{{ emp.name }} (CIN: {{ emp.cin }})</option>
          </select>
        </div><br>
        <div class="form-actions">
          <button type="button" class="btn btn-primary" (click)="uploadDocument()" [disabled]="isLoading">
            <i class="fas" [class.fa-upload]="!isLoading" [class.fa-spinner]="isLoading" [class.fa-spin]="isLoading"></i>
            Upload
          </button>
        </div>
      </form>
    </div>

    <!-- Generate Document View -->
    <div *ngIf="currentView === 'generate' && !isLoading && !errorMessage" class="generate-card">
      <h3><i class="fas fa-file-medical"></i> Generate Document</h3>
      <form class="form-grid">
        <div class="form-group">
          <label for="templateType"><i class="fas fa-file"></i> Certificate Type</label>
          <select id="templateType" class="form-control" [(ngModel)]="newDocument.templateType" name="templateType">
            <option *ngFor="let type of templateTypes" [value]="type">{{ type | titlecase }}</option>
          </select>
        </div>
        <div class="form-group">
          <label for="name"><i class="fas fa-heading"></i> Document Name</label>
          <input type="text" id="name" class="form-control" placeholder="Enter document name"
                 [(ngModel)]="newDocument.name" name="name" required>
        </div>
        <div class="form-group">
          <label for="content"><i class="fas fa-file-alt"></i> Document Content</label>
          <textarea id="content" class="form-control" placeholder="Enter document content"
                    [(ngModel)]="newDocument.content" name="content" required></textarea>
        </div>
        <div class="form-group">
          <label for="accessibleByTypeGen"><i class="fas fa-lock"></i> Access Type</label>
          <select id="accessibleByTypeGen" class="form-control" [(ngModel)]="accessibleByType" name="accessibleByTypeGen"
                  (ngModelChange)="onAccessibleByTypeChange()">
            <option value="all_departments">All Departments</option>
            <option value="department">Specific Department</option>
            <option value="employees">Specific Employees</option>
          </select>
        </div>
        <div class="form-group" *ngIf="accessibleByType === 'department'">
          <label for="departmentGen"><i class="fas fa-building"></i> Department</label>
          <select id="departmentGen" class="form-control" [(ngModel)]="departmentValue" name="departmentGen"
                  (ngModelChange)="fetchEmployees(departmentValue)">
            <option value="">Select Department</option>
            <option *ngFor="let dept of departments" [value]="dept">{{ dept }}</option>
          </select>
        </div>
        <div class="form-group" *ngIf="accessibleByType === 'employees'">
          <label for="employeesGen"><i class="fas fa-users"></i> Employees (Select Multiple)</label>
          <select id="employeesGen" class="form-control" [(ngModel)]="employeeCins" name="employeesGen" multiple>
            <option *ngFor="let emp of employees" [value]="emp.cin">{{ emp.name }} (CIN: {{ emp.cin }})</option>
          </select>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-primary" (click)="generateDocument()" [disabled]="isLoading">
            <i class="fas" [class.fa-file-medical]="!isLoading" [class.fa-spinner]="isLoading" [class.fa-spin]="isLoading"></i>
            Generate
          </button>
        </div>
      </form>
    </div>

    <!-- Document List View -->
    <div *ngIf="currentView === 'list' && !isLoading && !errorMessage" class="documents-card">
      <h3><i class="fas fa-list"></i> Document List</h3>
      <!-- Filter Section -->
      <div class="filter-section">
        <div class="filter-grid">
          <div class="filter-group">
            <input class="form-control" placeholder="Search by name..." [(ngModel)]="searchTerm" (ngModelChange)="filterDocuments()">
          </div>
          <div class="filter-group">
            <input type="date" class="form-control" placeholder="Start Date" [(ngModel)]="startDate" (ngModelChange)="filterDocuments()">
          </div>
          <div class="filter-group">
            <input type="date" class="form-control" placeholder="End Date" [(ngModel)]="endDate" (ngModelChange)="filterDocuments()">
          </div>
        </div>
      </div>
      <!-- Document List -->
      <div class="table-container">
        <table class="documents-table" *ngIf="filteredDocuments.length; else noDocuments">
          <thead>
          <tr>
            <th>Name</th>
            <th>Uploaded By</th>
            <th>Accessible By</th>
            <th>Upload Date</th>
            <th>Actions</th>
          </tr>
          </thead>
          <tbody>
          <tr *ngFor="let doc of filteredDocuments">
            <td>{{ doc.name }}</td>
            <td>{{ doc.uploadedBy }}</td>
            <td>{{ formatAccessibleBy(doc.accessibleBy) }}</td>
            <td>{{ doc.uploadDate | date }}</td>
            <td>
              <button class="btn btn-primary" (click)="downloadDocument(doc.id, doc.name)" [disabled]="isLoading">
                <i class="fas fa-download"></i> Download
              </button>
            </td>
          </tr>
          </tbody>
        </table>
        <ng-template #noDocuments>
          <p class="no-data"><i class="fas fa-info-circle"></i> No documents found.</p>
        </ng-template>
      </div>
    </div>
  </div>
</div>
<app-footer></app-footer>
