<nav class="navbar">
  <div class="container-fluid">
    <div class="navbar-brand profile-section">
      <a class="nav-link" routerLink="/profile">
        <img src="/assets/profile-placeholder.png" alt="Profile Photo" class="profile-photo">
        <span>{{ firstname }} {{ lastname }}</span>
      </a>
    </div>
    <div class="navbar-actions">
      <div class="notification-container">
        <button class="notification-icon" (click)="toggleNotifications()" title="Notifications">
          <i class="fas fa-bell"></i>
          <span *ngIf="notifications.length" class="badge">{{ notifications.length }}</span>
        </button>
        <div *ngIf="showNotifications" class="notification-dropdown">
          <div class="notification-header">Notifications</div>
          <div class="notification-list">
            <div *ngFor="let notification of notifications" class="notification-item" [class.read]="notification.isRead">
              <span>{{ notification.message }}</span>
              <button class="btn btn-sm btn-danger" (click)="deleteNotification(notification.id)">Delete</button>
            </div>
            <div *ngIf="!notifications.length" class="notification-item">No new notifications</div>
          </div>
        </div>
      </div>
      <button class="home-btn" routerLink="/welcome" title="Home">
        <i class="fas fa-home"></i>
      </button>
      <button class="logout-btn" (click)="logout()" title="Logout">
        <i class="fas fa-sign-out-alt"></i>
      </button>
    </div>
  </div>
</nav>
