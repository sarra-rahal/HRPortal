<div class="sidebar" [class.open]="isSidebarOpen">
  <button class="sidebar-btn" (click)="toggleSidebar()">
    <i class="bi" [class.bi-list]="!isSidebarOpen" [class.bi-x]="isSidebarOpen"></i>
  </button>
  <ul class="sidebar-menu">
    <li *ngIf="role === 'EMPLOYEE'">
      <a routerLink="/leave" (click)="toggleSidebar()">Leave</a>
    </li>
    <li *ngIf="role === 'EMPLOYEE'">
      <a routerLink="/training" (click)="toggleSidebar()">Training</a>
    </li>
    <li *ngIf="role === 'EMPLOYEE'">
      <a routerLink="/advance" (click)="toggleSidebar()">Advance on Salary</a>
    </li>
    <li *ngIf="role === 'EMPLOYEE'">
      <a routerLink="/documents" (click)="toggleSidebar()">Documents</a>
    </li>
    <li *ngIf="role === 'HR_MANAGER'">
      <a routerLink="/manage-leaves" (click)="toggleSidebar()">Manage Leave Requests</a>
    </li>
    <li *ngIf="role === 'HR_MANAGER'">
      <a routerLink="/manage-training" (click)="toggleSidebar()">Manage Training</a>
    </li>
    <li *ngIf="role === 'HR_MANAGER'">
      <a routerLink="/manage-advance" (click)="toggleSidebar()">Manage Advance on Salary</a>
    </li>
    <li *ngIf="role === 'HR_MANAGER'">
      <a routerLink="/manage-documents" (click)="toggleSidebar()">Manage Documents</a>
    </li>
    <li *ngIf="role === 'HR_MANAGER'">
      <a routerLink="/manage-employees" (click)="toggleSidebar()">Manage Employees</a>
    </li>
  </ul>
</div>
