<div class="auth-container">
  <div class="auth-card">
    <h2><i class="fas fa-sign-in-alt"></i> Sign In</h2>
    <form [formGroup]="signInForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email"><i class="fas fa-envelope"></i> Email</label>
        <input type="email" id="email" formControlName="email" [class.invalid]="signInForm.get('email')?.invalid && signInForm.get('email')?.touched">
        <div class="error" *ngIf="signInForm.get('email')?.touched && signInForm.get('email')?.errors">
          <span *ngIf="signInForm.get('email')?.errors?.['required']">Email is required</span>
          <span *ngIf="signInForm.get('email')?.errors?.['email']">Invalid email format</span>
        </div>
      </div>
      <div class="form-group">
        <label for="password"><i class="fas fa-lock"></i> Password</label>
        <div class="password-container">
          <input [type]="showPassword ? 'text' : 'password'" id="password" formControlName="password" [class.invalid]="signInForm.get('password')?.invalid && signInForm.get('password')?.touched">
          <i class="fas" [class.fa-eye]="!showPassword" [class.fa-eye-slash]="showPassword" (click)="togglePassword()"></i>
        </div>
        <div class="error" *ngIf="signInForm.get('password')?.touched && signInForm.get('password')?.errors">
          <span *ngIf="signInForm.get('password')?.errors?.['required']">Password is required</span>
        </div>
      </div>
      <div class="error" *ngIf="errorMessage">{{ errorMessage }}</div>
      <button type="submit" [disabled]="signInForm.invalid || loading">
        <span *ngIf="loading" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
        {{ loading ? ' Signing In...' : 'Sign In' }}
      </button>
      <div class="links">
        <a routerLink="/forgot-password">Forgot Password?</a>
        <a routerLink="/sign-up">Create an Account</a>
      </div>
    </form>
  </div>
</div>
