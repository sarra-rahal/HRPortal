<div class="auth-container">
  <div class="auth-card">
    <h2><i class="fas fa-lock"></i> Reset Password</h2>
    <div class="notification success" *ngIf="successMessage">{{ successMessage }}</div>
    <div class="notification error" *ngIf="errorMessage">{{ errorMessage }}</div>
    <form [formGroup]="resetForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="newPassword"><i class="fas fa-lock"></i> New Password</label>
        <div class="password-container">
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="newPassword"
            formControlName="newPassword"
            [class.invalid]="resetForm.get('newPassword')?.invalid && resetForm.get('newPassword')?.touched"
          >
          <i
            class="fas"
            [class.fa-eye]="!showPassword"
            [class.fa-eye-slash]="showPassword"
            (click)="togglePassword()"
          ></i>
        </div>
        <div class="error" *ngIf="resetForm.get('newPassword')?.touched && resetForm.get('newPassword')?.errors">
          <span *ngIf="resetForm.get('newPassword')?.errors?.['required']">Password is required</span>
          <span *ngIf="resetForm.get('newPassword')?.errors?.['minlength']">Password must be at least 8 characters</span>
          <span *ngIf="resetForm.get('newPassword')?.errors?.['pattern']">Password must contain uppercase, lowercase, and a number</span>
        </div>
      </div>
      <div class="form-group">
        <label for="confirmPassword"><i class="fas fa-lock"></i> Confirm Password</label>
        <div class="password-container">
          <input
            [type]="showConfirmPassword ? 'text' : 'password'"
            id="confirmPassword"
            formControlName="confirmPassword"
            [class.invalid]="resetForm.get('confirmPassword')?.invalid && resetForm.get('confirmPassword')?.touched"
          >
          <i
            class="fas"
            [class.fa-eye]="!showConfirmPassword"
            [class.fa-eye-slash]="showConfirmPassword"
            (click)="toggleConfirmPassword()"
          ></i>
        </div>
        <div class="error" *ngIf="resetForm.get('confirmPassword')?.touched && (resetForm.get('confirmPassword')?.errors || resetForm.errors?.['mismatch'])">
          <span *ngIf="resetForm.get('confirmPassword')?.errors?.['required']">Confirmation is required</span>
          <span *ngIf="resetForm.errors?.['mismatch']">Passwords do not match</span>
        </div>
      </div>
      <button type="submit" [disabled]="resetForm.invalid || loading">
        <span *ngIf="loading" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
        {{ loading ? ' Resetting...' : 'Reset Password' }}
      </button>
      <div class="links">
        <a routerLink="/sign-in">Back to Sign In</a>
      </div>
    </form>
  </div>
</div>
