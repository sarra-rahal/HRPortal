<div class="auth-container">
  <h2>Forgot Password</h2>
  <form (ngSubmit)="onSubmit()" #forgotForm="ngForm">
    <div class="form-group">
      <label for="employeeNumber">Employee Number</label>
      <input
        type="text"
        id="employeeNumber"
        name="employeeNumber"
        ngModel
        required
        #employeeNumber="ngModel"
        [class.invalid]="employeeNumber.invalid && employeeNumber.touched"
      >
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        name="email"
        ngModel
        required
        email
        #email="ngModel"
        [class.invalid]="email.invalid && email.touched"
      >
    </div>

    <button type="submit" [disabled]="forgotForm.invalid">Reset Password</button>
    <a routerLink="/sign-in">Back to Sign In</a>
  </form>
</div>
