<div class="auth-container">
  <div class="auth-card">
    <h2><i class="fas fa-key"></i> Forgot Password</h2>
    <div class="notification success" *ngIf="successMessage">{{ successMessage }}</div>
    <div class="notification error" *ngIf="errorMessage">{{ errorMessage }}</div>
    <form (ngSubmit)="onSubmit(forgotForm)" #forgotForm="ngForm">
      <div class="form-group">
        <label for="employeeNumber"><i class="fas fa-id-badge"></i> Employee Number</label>
        <input
          type="text"
          id="employeeNumber"
          name="employeeNumber"
          ngModel
          required
          pattern="[0-9]{6,12}"
          #employeeNumber="ngModel"
          [class.invalid]="employeeNumber.invalid && employeeNumber.touched"
        >
        <div class="error" *ngIf="employeeNumber.touched && employeeNumber.errors">
          <span *ngIf="employeeNumber.errors?.['required']">Employee Number is required</span>
          <span *ngIf="employeeNumber.errors?.['pattern']">Employee Number must be 6-12 digits</span>
        </div>
      </div>
      <div class="form-group">
        <label for="email"><i class="fas fa-envelope"></i> Email</label>
        <input
          type="email"
          id="email"
          name="email"
          ngModel
          required
          email
          #email="ngModel"
          [class.invalid]="email.invalid && email.touched"
        >
        <div class="error" *ngIf="email.touched && email.errors">
          <span *ngIf="email.errors?.['required']">Email is required</span>
          <span *ngIf="email.errors?.['email']">Invalid email format</span>
        </div>
      </div>
      <button type="submit" [disabled]="forgotForm.invalid || loading">
        <span *ngIf="loading" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
        {{ loading ? ' Sending...' : 'Reset Password' }}
      </button>
      <div class="links">
        <a routerLink="/sign-in">Back to Sign In</a>
      </div>
    </form>
  </div>
</div>
